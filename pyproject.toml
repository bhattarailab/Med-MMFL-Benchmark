[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "med-mmfl-bench"
version = "1.0.0"
description = "Med-MMFL: A Multimodal Federated Learning Benchmark in Healthcare"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Aavash Chhetri"},
    {name = "Bibek Niroula"},
    {name = "Pratik Shrestha"},
    {name = "Loris Bazzani"},
    {name = "Binod Bhattarai"}
]
classifiers = [
    "Development Status :: 1 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Deep Learning
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchmetrics==1.7.4",
    "lightning==2.5.2",
    "pytorch-lightning==2.5.2",
    "lightning-utilities==0.14.3",
    "triton==3.3.1",

    # Transformers / NLP
    "transformers==4.55.0",
    "tokenizers==0.21.4",
    "huggingface-hub==0.34.4",
    "safetensors==0.6.2",
    "hf-xet==1.1.7",
    "sentencepiece==0.1.96",
    "open-clip-torch==3.2.0",
    "timm==1.0.22",
    "ftfy==6.3.1",

]

[project.optional-dependencies]
wandb = ["wandb==0.21.0"]
cuda = [
    "nvidia-cublas-cu12==12.6.4.1",
    "nvidia-cuda-cupti-cu12==12.6.80",
    "nvidia-cuda-nvrtc-cu12==12.6.77",
    "nvidia-cuda-runtime-cu12==12.6.77",
    "nvidia-cudnn-cu12==9.5.1.17",
    "nvidia-cufft-cu12==11.3.0.4",
    "nvidia-cufile-cu12==1.11.1.6",
    "nvidia-curand-cu12==10.3.7.77",
    "nvidia-cusolver-cu12==11.7.1.2",
    "nvidia-cusparse-cu12==12.5.4.2",
    "nvidia-cusparselt-cu12==0.6.3",
    "nvidia-nccl-cu12==2.26.2",
    "nvidia-nvjitlink-cu12==12.6.85",
    "nvidia-nvtx-cu12==12.6.77",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.5",
    "pre-commit>=3.0",
]
all = ["med-mmfl-bench[wandb,cuda,dev]"]

[project.scripts]
med-mmfl-bench = "med_mmfl_bench.cli:main"

[project.urls]
Homepage = "https://github.com/bhattarailab/Med-MMFL-Benchmark/"
Documentation = "https://github.com/bhattarailab/Med-MMFL-Benchmark/#readme"
Issues = "https://github.com/bhattarailab/Med-MMFL-Benchmark/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["med_mmfl_bench"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
dataset:
  img_path: /scratch/achhetr1/.tmp/bench_data/mimic-cxr-resized/files/
  ann_path: /scratch/achhetr1/.tmp/bench_data/
  dset_name: mimic-cxr #iuxray
  view: APPA #view1 # frontal #APPA
  partition: iid-c3-w_val

dataloader:
  batch_size: 48
  eval_batch_size: 96
  num_workers: 16
  crop_size: 224

model:
  name: mimic_mmclf
  embed_dim: 256  # origin 2048
  cnn_type: resnet50
  txt_type: bert-base-uncased

# optimizer configuration
optimizer:
  name: adam
  learning_rate: 0.0001
  weight_decay: 0.0

# lr scheduler configuration
lr_scheduler:
  name: cosine_annealing
  T_max: 40
  warmup: 0

# criterion configuration
criterion:
  name: BCEWithLogitsLoss

# detailed training configuration
train:
  total_epoch: 30
  local_epoch: 3
  model_save_path: model_last.pth
  best_model_save_path: model_best.pth
  pretrain_epochs: 0
  finetune_epochs: 30
  finetune_lr_decay: 0.1
  log_step: 1000
  grad_clip: 2
  val_epochs: 10
  pretrain_val_epochs: 10
  use_fp16: True
  output_file: model.log
  partition: hetero
  mu: 0.1
  moon_mu: 0.5
  moon_tempr: 0.5
  kd_weight: 0.03
  interintra_weight: 0.002
